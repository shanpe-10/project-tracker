name: Pilot deployment checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tracker_migration_test
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker_test -d tracker_migration_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_DATABASE: tracker_migration_test
      DB_HOST: 127.0.0.1
      DB_USERNAME: tracker_test
      DB_PASSWORD: test-only-password
      DB_PORT: 5432
      DB_URL: ''
      PG_DUMP_BINARY: /usr/lib/postgresql/18/bin/pg_dump
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, dom, zip, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - name: Generate temporary test key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Run PostgreSQL integration checks
        run: php vendor/bin/phpunit -c phpunit.cloud.xml
      - name: Check account sessions and draft preservation
        run: |
          node tests/account-sessions.test.cjs
          node tests/shared-updates.test.cjs
      - name: Check project alert badges
        run: node tests/project-alert-badges.test.cjs
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tracker_container_test
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker_test -d tracker_container_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Build PHP production image
        run: docker build -t tracker-pilot .
      - name: Check PHP extensions and PostgreSQL client
        run: |
          docker run --rm tracker-pilot php -r 'foreach (["pdo_pgsql","mbstring","zip","intl","dom","fileinfo"] as $extension) { if (!extension_loaded($extension)) exit(1); }'
          docker run --rm tracker-pilot /usr/lib/postgresql/18/bin/pg_dump --version
          docker run --rm tracker-pilot sh -n deploy/start.sh
      - name: Start production container against a fresh test database
        run: |
          docker run -d --name tracker-smoke --network host \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY_BASE64="$(openssl rand -base64 32)" \
            -e DB_URL='postgresql://tracker_test:test-only-password@127.0.0.1:5432/tracker_container_test' \
            -e TRACKER_CLOUD=true -e TRACKER_MEDIA_DISK=s3 \
            -e SESSION_DRIVER=database -e CACHE_STORE=database -e LOG_CHANNEL=stderr \
            -e TRACKER_BOOTSTRAP_NAME='Pilot CI' -e TRACKER_BOOTSTRAP_USERNAME=pilot.ci \
            -e TRACKER_BOOTSTRAP_PASSWORD=test-only-pilot-password tracker-pilot
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:10000/up >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:10000/up >/dev/null
          curl -fsS http://localhost:10000/ | grep -q 'Project Tracker'
          curl -fsS -c /tmp/tracker-cookies -H 'Content-Type: application/json' \
            -d '{"action":"login","username":"pilot.ci","password":"test-only-pilot-password"}' \
            http://localhost:10000/api/auth.php > /tmp/tracker-login.json
          php -r '$payload=json_decode(file_get_contents("/tmp/tracker-login.json"),true); if (empty($payload["ok"])) exit(1);'
      - name: Container diagnostics
        if: failure()
        run: docker logs tracker-smoke || true
