# One free PHP web service; database and private files live in Neon.
services:
  - type: web
    name: laoag-project-tracker-pilot
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: LGU Laoag Project Tracker Pilot
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY_BASE64
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: TRACKER_CLOUD
        value: "true"
      - key: TRACKER_MEDIA_DISK
        value: s3
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: TRACKER_BOOTSTRAP_NAME
        sync: false
      - key: TRACKER_BOOTSTRAP_USERNAME
        sync: false
      - key: TRACKER_BOOTSTRAP_PASSWORD
        sync: false
